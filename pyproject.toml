[project]
name = "news-rag-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch==8.15.0",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "hvac>=2.1.0,<3.0.0",
    "langchain==0.3.0",
    "langchain-openai==0.2.0",
    "langsmith==0.1.120",
    "openai==1.52.0",
    "pydantic==2.9.2",
    "uvicorn[standard]>=0.18.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ty==0.0.82",
]

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]
[tool.ty.rules]
unused-ignore-comment = "warn"
