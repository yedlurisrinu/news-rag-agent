[project]
name = "news-rag-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch==8.15.0",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "hvac>=2.1.0,<3.0.0",
    "langchain>=1.4.2",
    "langchain-core==1.6.3",
    "langchain-openai==1.6.2",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith==0.13.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic==2.9.2",
    "ruff==0.16.8",
    "uvicorn[standard]>=0.18.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true      # langgraph, langsmith and hvac ship no stubs
warn_unused_ignores = true

[tool.uv]
package = true
