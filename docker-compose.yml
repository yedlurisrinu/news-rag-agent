# ── Services ──────────────────────────────────────────────────────────────────
services:
  # ── News Summary RAG App ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: news-summary-agent
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      - PYTHONPATH=src
      - VAULT_ADDR=http://vault-server:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_SECRET_PATH=secret/CREDENTIALS
    networks:
      - vault-network
      - services_network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8007/health\")' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ../logs:/app/logs

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  vault-network:
    external: true
  services_network:
    external: true